<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Incremental Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="console">
        <div class="log">
            <span>. </span>
            <span id="consoleline5">aaa</span>
            <br>
            <span>. </span>
            <span id="consoleline4">aaa</span>
            <br>
            <span>. </span>
            <span id="consoleline3">aaa</span>
            <br>
            <span>. </span>
            <span id="consoleline2">aaa</span>
            <br>
        </div>
        <div class="currentlog">
            <span>> </span>
            <span>Welcome to the Incremental Game</span>
        </div>
    </div>
    <div id="topBar">
        Incrementals:
        <span id="incrementals">0</span>
    </div>
    <div id="leftColoumn">
        <button class="button">Generate Incremental</button>
        <br>
        <br>
        <div id="businessDiv">
            <b>Business</b>
            <hr>
            Avaliable Cash: $
            <span id="cash">0</span>
            <br>
            Avg. Cash per sec: $
            <span id="avgCashPerSec">0.00</span>
            <br>
            Avg. Sold per sec: 
            <span id="amountSoldPerSec">0</span>
            <br>
            Unsold Inventory
            <span id="unsoldAmount">0</span>
            <br>
            <button>Raise</button>
            <button>Lower</button>
            Price per: $
            <span id="incrementalPrice">0.30</span>
            <br>
            Public Demand: 
            <span id="demand">69%</span>
            <br>
            <br>
            <button>Marketing</button>
            Level: 
            <span id="marketingLevel">0</span>
            <br>
            Cost: $ 
            <span id="marketingCost">100</span>
            <br>
            <br>
        </div>
        <div id="manufacturingDiv">
            <b>Manufacturing</b>
            <hr>
            Incrementals per Second: 
            <span id="incrementalsPerSecond">0</span>
        </div>
    </div>



    <script src="index.js"></script>
</body>
</html>
